name: Publish Google Apps Script
# Per sicurezza: il primo rilascio richiede un avvio manuale e i secret.
# L'automatismo su main si abilita impostando AUTO_DEPLOY_ENABLED=true in GitHub Variables.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps-script/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/google-apps-script.yml'
permissions:
  contents: read
concurrency:
  group: padel-booking-google-production
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: google-production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and unit tests
        run: npm test
      - name: Check required secrets
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$APPS_SCRIPT_ID" || { echo 'Missing APPS_SCRIPT_ID'; exit 1; }
          test -n "$APPS_SCRIPT_DEPLOYMENT_ID" || { echo 'Missing APPS_SCRIPT_DEPLOYMENT_ID'; exit 1; }
          test -n "$CLASPRC_JSON" || { echo 'Missing CLASPRC_JSON'; exit 1; }
      - name: Create local clasp configuration
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          mkdir -p "$HOME"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const id=process.env.APPS_SCRIPT_ID;
          if (!/^[A-Za-z0-9_-]{15,}$/.test(id)) throw Error('APPS_SCRIPT_ID non valido');
          JSON.parse(fs.readFileSync(process.env.HOME+'/.clasprc.json','utf8'));
          fs.writeFileSync('.clasp.json',JSON.stringify({scriptId:id,rootDir:'apps-script'}));
          NODE
      - name: Check existing Apps Script file inventory
        # A read-only pull into a temporary folder lets us spot files that
        # clasp push --force would otherwise remove from the Google project.
        run: |
          REMOTE_DIR="$(mktemp -d)"
          export REMOTE_DIR
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const project = JSON.parse(fs.readFileSync('.clasp.json', 'utf8'));
          const config = {scriptId: project.scriptId, rootDir: 'apps-script'};
          fs.mkdirSync(path.join(process.env.REMOTE_DIR, 'apps-script'), {recursive: true});
          fs.writeFileSync(path.join(process.env.REMOTE_DIR, '.clasp.json'), JSON.stringify(config));
          NODE
          (cd "$REMOTE_DIR" && npx --yes @google/clasp@3.4.1 pull)
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const filenames = dir => fs.readdirSync(dir, {withFileTypes: true})
            .filter(entry => entry.isFile() && /\.(gs|html|json)$/i.test(entry.name))
            .map(entry => entry.name);
          const remote = filenames(path.join(process.env.REMOTE_DIR, 'apps-script'));
          const local = new Set(filenames('apps-script'));
          if (!remote.length) {
            console.error('Remote inventory empty; refusing to overwrite the Google project.');
            process.exit(1);
          }
          const extras = remote.filter(name => !local.has(name));
          if (extras.length) {
            console.error('Extra files on Google Apps Script, absent from GitHub: ' + extras.join(', '));
            console.error('Stop: import/reconcile those files before deploying.');
            process.exit(1);
          }
          console.log('Preflight OK: ' + remote.length + ' remote files are covered by GitHub.');
          NODE
      - name: Push versioned code to existing script
        run: npx --yes @google/clasp@3.4.1 push --force
      - name: Update existing web app deployment
        env:
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          # Updating an existing deployment preserves its web app URL and access settings.
          npx --yes @google/clasp@3.4.1 update-deployment "$DEPLOYMENT_ID" --description 'Padel Booking Leon v1.4' >/dev/null
          echo 'Web app deployment updated to v1.4.'
